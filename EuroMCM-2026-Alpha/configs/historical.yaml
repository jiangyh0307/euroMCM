# Historical baseline and scan design.
# All numerical values are ASSUMPTION or ESTIMATE as recorded in src/alpha/parameters.py.
# The authoritative executable defaults are in src/alpha/historical.py.
baseline:
  beta_N: 0.055
  beta_M: 0.055
  delta_N: 0.035
  delta_M: 0.035
  w_N: 1.0
  w_M: 1.0
  m_N: 2700.0       # kcal/person/day, adult-equivalent approximation
  m_M: 2500.0
  ell_N: 1.0        # km^2/person, effective land/habitat access
  ell_M: 1.0
  S_E: 6.0e10       # kcal/year
  S_L: 1.0e6        # km^2
  N0: 50000.0
  M0: 5000.0
  N_ref: 50000.0
  kappa: 0.01
  t_max: 10000.0
compatibility_scan:
  w_ratio_min: 0.2
  w_ratio_max: 2.0
  w_ratio_points: 25
  beta_ratio_min: 0.5
  beta_ratio_max: 1.5
  beta_ratio_points: 25
  european_band: [2600, 5400]
  regional_band: [1400, 2900]
sensitivity:
  kappa: [0.001, 0.005, 0.01, 0.02, 0.05]
  M0_over_N0: [0.01, 0.05, 0.1, 0.5, 1.0, 10.0]
  m_N_minus_m_M: [100.0, 200.0, 350.0]
